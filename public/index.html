<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>Squirrel Combat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%90%BF%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="loader">
  <div class="brand">SQUIRREL COMBAT</div>
  <div class="spinner"></div>
  <div class="txt" id="loaderTxt">Инициализация...</div>
</div>

<div id="app">
  <header id="hdr">
    <div id="logo" onclick="UI.go('cards')">🐿️ <b>SC</b></div>
    <div class="stat"><span class="k">Баланс</span><span class="v" id="hBal">0</span></div>
    <div class="stat"><span class="k">В час</span><span class="v neon" id="hPerHour">0</span></div>
    <div class="stat"><span class="k">Лига</span><span class="v pink" id="hLeague">1</span></div>
    <div id="hdrRight">
      <button class="hdr-btn icon" id="soundBtn" title="Звук">🔊</button>
      <button class="hdr-btn accent" id="bonusBtn">🎁</button>
    </div>
  </header>

  <main id="main">
    <section class="page" id="p-cards"></section>
    <section class="page on" id="p-home">
      <div class="user-block">
        <div id="uname">Загрузка...</div>
        <div id="league" class="league">Лига 1</div>
      </div>
      <div class="squirrel-wrap">
        <div id="squirrel">🐿️</div>
        <div id="floatLayer"></div>
      </div>
      <div class="energy-row">
        <span>⚡</span>
        <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
        <span id="energyText">1000 / 1000</span>
      </div>
      <div class="actions">
        <button id="claimBtn">💤 Собрать оффлайн</button>
        <button id="boostBtn">⚡ Полная энергия</button>
      </div>
    </section>
    <section class="page" id="p-boosts"></section>
    <section class="page" id="p-session"></section>
    <section class="page" id="p-duel"></section>
    <section class="page" id="p-clan"></section>
    <section class="page" id="p-daily"></section>
    <section class="page" id="p-ach"></section>
    <section class="page" id="p-season"></section>
    <section class="page" id="p-league"></section>
    <section class="page" id="p-promo"></section>
    <section class="page" id="p-ref"></section>
    <section class="page" id="p-refcontest"></section>
    <section class="page" id="p-channel"></section>
    <section class="page" id="p-wheel"></section>
    <section class="page" id="p-tasks"></section>
    <section class="page" id="p-top"></section>
    <section class="page" id="p-profile"></section>
  </main>

  <nav class="tabs" id="tabs"></nav>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
  </html>
